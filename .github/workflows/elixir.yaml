name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        otp: ["29.0"]
        elixir: ["1.20.0"]
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: guard-test
          POSTGRES_DB: guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{runner.os}}-mix-deps-${{matrix.otp}}-${{matrix.elixir}}-${{hashFiles('**/mix.lock')}}
          restore-keys: ${{runner.os}}-mix-deps-${{matrix.otp}}-${{matrix.elixir}}-

      - name: Cache compiled build
        uses: actions/cache@v5
        with:
          path: _build
          key: ${{runner.os}}-mix-build-${{matrix.otp}}-${{matrix.elixir}}-${{hashFiles('**/mix.lock')}}
          restore-keys: ${{runner.os}}-mix-build-${{matrix.otp}}-${{matrix.elixir}}-

      # Incremental builds occasionally go stale; only re-runs pay for a clean build.
      - name: Clean to rule out incremental build as a source of flakiness
        if: github.run_attempt != '1'
        run: |
          mix deps.clean --all
          mix clean
        shell: sh

      - name: Install dependencies
        run: mix deps.get

      # Library code only. test/support resources are excluded on purpose:
      # Ash's generated code (Inspect protocol, input/1) trips Elixir's type
      # checker, and those warnings are not ours to fix.
      - name: Compiles without warnings
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        env:
          ASH_RA_POSTGRES_PORT: "5432"
        run: mix test
